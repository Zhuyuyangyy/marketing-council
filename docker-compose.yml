version: "3.8"

services:
  # ============================================================
  # MarketingCouncil Backend
  # ============================================================
  marketing-council:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marketing-council
    ports:
      - "8009:8009"
    environment:
      - SPARK_APP_ID=${SPARK_APP_ID:-}
      - SPARK_API_KEY=${SPARK_API_KEY:-}
      - SPARK_API_SECRET=${SPARK_API_SECRET:-}
      - SPARK_API_VERSION=${SPARK_API_VERSION:-generalv3.5}
      - DIFY_API_URL=${DIFY_API_URL:-}
      - DIFY_API_KEY=${DIFY_API_KEY:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8009/health'); assert r.status_code == 200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================
  # Nginx Reverse Proxy (optional)
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: marketing-council-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      marketing-council:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - with-nginx
